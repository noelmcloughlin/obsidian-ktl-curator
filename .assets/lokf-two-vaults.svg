<svg width="720" height="424" viewBox="0 0 720 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Where it meets an Obsidian vault</title>
<desc id="d">Left, the workshop: a vault or repository tree with notes, .obsidian/, and a .lokf/knowledge/ sidecar plus a knowledge_bundle link pointing at it; Obsidian lists neither. Never migrated. An arrow labelled File, Open folder as vault leads right to the exhibition: the same folder opened as its own small vault, with index.md carrying the LOKF header, and the two plugins installed there: LOKF Registrar showing LOKF check in the status bar, LOKF Curator showing Confirmed 12 of 40. The two vaults never index the same file. A band below notes that git carries the link while sync services drop it, and just lokf-link recreates it per machine.</desc>
<rect width="720" height="424" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">Where it meets an Obsidian vault</text>
<rect x="20" y="48" width="680" height="280" rx="20" fill="#F1EFE8"/>
<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Two vaults, one folder, no shared index</text>
<rect x="40" y="92" width="296" height="214" rx="12" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<g transform="translate(62,110)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-9" width="20" height="18" rx="2"/><line x1="-10" y1="-3" x2="10" y2="-3"/><line x1="-4" y1="-3" x2="-4" y2="9"/></g>
<text x="80" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Workshop</text>
<text x="150" y="114" font-family="Arial, sans-serif" font-size="10.5" fill="#888780">your vault, or a repository</text>
<text x="58" y="140" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#2C2C2A">my-vault/</text>
<text x="72" y="156" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">notes/  projects/  daily/</text>
<text x="72" y="172" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">.obsidian/</text>
<text x="72" y="188" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">.lokf/</text>
<text x="86" y="204" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#27500A">knowledge/</text>
<text x="72" y="222" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">knowledge_bundle  ->  .lokf/knowledge</text>
<text x="220" y="204" font-family="Arial, sans-serif" font-size="10" fill="#27500A">the exhibition</text>
<text x="58" y="246" font-family="Arial, sans-serif" font-size="10" fill="#888780">Obsidian never indexes a dot-folder, and skips a link</text>
<text x="58" y="259" font-family="Arial, sans-serif" font-size="10" fill="#888780">that resolves inside the vault - so neither is listed here.</text>
<text x="58" y="280" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#5F5E5A">Never migrated. The workshop stays yours.</text>
<line x1="344" y1="199" x2="392" y2="199" stroke="#888780" stroke-width="1.3"/><path d="M385.4 203.5 L392 199 L385.4 194.5" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="368" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888780">File → Open</text>
<text x="368" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888780">folder as vault</text>
<rect x="400" y="92" width="288" height="214" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(422,112)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="-8" y1="6" x2="0" y2="-8"/><line x1="8" y1="6" x2="0" y2="-8"/><line x1="-8" y1="6" x2="8" y2="6"/><circle cx="0" cy="-8" r="3" fill="#EAF3DE"/><circle cx="-8" cy="6" r="3" fill="#EAF3DE"/><circle cx="8" cy="6" r="3" fill="#EAF3DE"/></g>
<text x="440" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Exhibition</text>
<text x="514" y="114" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">the bundle, opened as a vault</text>
<text x="418" y="140" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#27500A">index.md</text>
<text x="490" y="140" font-family="Arial, sans-serif" font-size="9.5" fill="#27500A">LOKF header = the whole vault is the bundle</text>
<text x="418" y="156" font-family="Menlo, Consolas, monospace" font-size="11" fill="#27500A">concepts/  playbooks/  log.md</text>
<text x="418" y="178" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">Plugins installed here, nothing to configure:</text>
<rect x="418" y="186" width="122" height="50" rx="8" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/>
<text x="428" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7A4E0B">LOKF Registrar</text>
<rect x="428" y="210" width="58" height="18" rx="9.0" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/><text x="457.0" y="223.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7A4E0B">LOKF   </text>
<path d="M473 219 l3 3 l6 -7" fill="none" stroke="#7A4E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="494" y="223" font-family="Arial, sans-serif" font-size="9.5" fill="#7A4E0B">as you type</text>
<rect x="552" y="186" width="122" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="562" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0C447C">LOKF Curator</text>
<rect x="562" y="210" width="104" height="18" rx="9.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="614.0" y="223.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0C447C">Confirmed 12/40</text>
<text x="418" y="258" font-family="Arial, sans-serif" font-size="10" fill="#888780">Skills fill and refresh this folder from a terminal or CI;</text>
<text x="418" y="271" font-family="Arial, sans-serif" font-size="10" fill="#888780">the plugins never call them - the folder is all they share.</text>
<text x="418" y="292" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#27500A">Two vaults never index the same file.</text>
<rect x="20" y="340" width="680" height="44" rx="12" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<g transform="translate(44,362)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-45)"><rect x="-9" y="-3" width="10" height="6" rx="3"/><rect x="-1" y="-3" width="10" height="6" rx="3"/></g></g>
<text x="62" y="357" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2C2C2A">Git carries the link.</text>
<text x="196" y="357" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">Sync services (OneDrive, Dropbox, Drive, iCloud) carry .lokf/ as files but drop links:</text>
<text x="62" y="373" font-family="Arial, sans-serif" font-size="10.5" fill="#888780">there, just lokf-link recreates it per machine - or open the bundle by path, .lokf/knowledge, and the result is the same vault.</text>
<circle cx="40" cy="408" r="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<text x="51" y="412" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">raw / unprocessed</text>
<circle cx="171" cy="408" r="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="182" y="412" font-family="Arial, sans-serif" font-size="12" fill="#27500A">an agent derives it</text>
<circle cx="315" cy="408" r="5" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/>
<text x="326" y="412" font-family="Arial, sans-serif" font-size="12" fill="#7A4E0B">deterministic tools check it</text>
<circle cx="517" cy="408" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="528" y="412" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">a named person vouches for it</text>
</svg>
